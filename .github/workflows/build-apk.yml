name: Build & Release APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.11.1'
        cache-disabled: true

    - name: Restore signing keystore
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/musicalified.p12"
        {
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/musicalified.p12"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
        } >> "$GITHUB_ENV"

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        set -o pipefail
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "========== COMPILER ERROR DUMP =========="
            grep -E -C 2 "(e: |error:|FAILURE:)" build.log || tail -n 100 build.log
            exit 1
        }

    - name: Check APK Output
      run: |
        ls -laR app/build/outputs/ || true
        find . -name "*.apk" || true

    - name: Upload Build Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Musicalified-RPC-Debug
        path: "**/build/outputs/apk/**/*.apk"

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
