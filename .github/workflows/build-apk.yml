name: Build & Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'
        cache-disabled: true

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        set -o pipefail
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

    - name: Check APK Output
      run: |
        ls -laR app/build/outputs/ || true
        find . -name "*.apk" || true

    - name: Publish Build Summary
      if: always()
      run: |
        echo "## Build Log Summary" >> $GITHUB_STEP_SUMMARY
        echo '```text' >> $GITHUB_STEP_SUMMARY
        if [ -f build.log ]; then tail -n 80 build.log >> $GITHUB_STEP_SUMMARY; fi
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Musicalified-RPC-Debug
        path: "**/build/outputs/apk/**/*.apk"

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
